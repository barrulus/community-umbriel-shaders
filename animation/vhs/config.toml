# Merge into ~/.config/umbriel/config.toml; append includes and merge existing tables.
[include]
files = ["shaders/community/animation/vhs/effect.toml"]

[animation]
enabled = true

[animation.windows_in]
enabled = true
effect = "vhs"
duration_ms = 750
curve = "linear"

[animation.windows_out]
enabled = true
effect = "vhs"
duration_ms = 650
curve = "linear"
