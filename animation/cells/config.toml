# Merge into ~/.config/umbriel/config.toml; append includes and merge existing tables.
[include]
files = ["shaders/community/animation/cells/effect.toml"]

[animation]
enabled = true

[animation.windows_in]
enabled = true
effect = "cells"
duration_ms = 1200
curve = "linear"

[animation.windows_out]
enabled = true
effect = "cells"
duration_ms = 1100
curve = "linear"
