# Merge into ~/.config/umbriel/config.toml; append includes and merge existing tables.
[include]
files = ["shaders/community/animation/wet-paint/effect.toml"]

[animation]
enabled = true

[animation.windows_in]
enabled = true
effect = "wet-paint"
duration_ms = 1150
curve = "linear"

[animation.windows_out]
enabled = true
effect = "wet-paint"
duration_ms = 1000
curve = "linear"
