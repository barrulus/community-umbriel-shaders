# Merge into ~/.config/umbriel/config.toml; append includes and merge existing tables.
[include]
files = ["shaders/community/animation/glitch/effect.toml"]

[animation]
enabled = true

[animation.windows_in]
enabled = true
effect = "glitch"
duration_ms = 800
curve = "linear"

[animation.windows_out]
enabled = true
effect = "glitch"
duration_ms = 700
curve = "linear"
