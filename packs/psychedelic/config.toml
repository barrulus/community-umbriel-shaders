# Merge into ~/.config/umbriel/config.toml; append includes and merge tables.
[include]
files = [
  "shaders/community/border/fractal-flow/effect.toml",
  "shaders/community/window/fractal-veil/effect.toml",
  "shaders/community/animation/fractal-iris/effect.toml",
  "shaders/community/animation/fractal-bloom/effect.toml",
]

[effects]
border = "psychedelic.fractal-flow"
window = "psychedelic.fractal-veil"

[animation]
enabled = true

[animation.workspaces]
enabled = true
style = "reveal"
effect = "psychedelic.fractal-iris"
duration_ms = 1100
curve = "linear"

[animation.windows_in]
enabled = true
effect = "psychedelic.fractal-bloom"
duration_ms = 700
curve = "linear"

[animation.windows_out]
enabled = true
effect = "psychedelic.fractal-bloom"
duration_ms = 450
curve = "linear"
